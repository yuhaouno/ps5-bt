<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PS5-BT control</title><link rel="stylesheet" href="/control.css"><script src="/control.js" defer></script></head>
<body><main><h1>PS5-BT control</h1><p>Local management · experimental · PS5 playback remains unverified.</p><section><label for="token">Control token</label><input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"><button id="unlock">Unlock</button><button id="lock">Lock</button><p>Token stays in this page's memory. Use only a trusted local network.</p></section><p id="message" role="status">Enter the token to manage devices.</p><section><h2>Status</h2><pre id="status">Unavailable</pre><button id="refresh">Refresh</button></section><section><h2>Devices</h2><div id="devices"></div><p id="selected">No device selected</p><button data-action="scan">Scan</button><button data-action="cancel-scan">Cancel scan</button><button data-action="pair">Pair selected</button><button data-action="connect">Connect</button><button data-action="forget">Forget selected</button></section><section id="approval" hidden><h2>Pairing approval</h2><p id="approval-text"></p><button data-action="approve">Approve</button><button data-action="reject">Reject</button></section><section><h2>Audio</h2><button data-action="start">Start</button><button data-action="stop">Stop</button><button data-action="disconnect">Disconnect</button></section></main></body></html>
