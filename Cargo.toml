[workspace]
members = [
    "crates/bt-a2dp",
    "crates/bt-avdtp",
    "crates/bt-core",
    "crates/bt-codec",
    "crates/bt-control",
    "crates/bt-hci",
    "crates/bt-l2cap",
    "crates/bt-link",
    "crates/bt-media-session",
    "crates/bt-sdp",
    "crates/ps5-sys",
    "crates/ps5-platform",
    "crates/ps5-runtime",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
panic = "abort"
lto = false
codegen-units = 1
