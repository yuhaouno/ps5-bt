name: Bootstrap checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  host-and-archive:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Load pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Host tests, C boundary and no_std archive
        run: make check check-c-sanitize
