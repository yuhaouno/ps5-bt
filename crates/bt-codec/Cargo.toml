[package]
name = "bt-codec"
description = "Bounded no_std ownership wrapper for the selected SBC encoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = []
host-libsbc = []
target-libsbc = []

[dependencies]
bt-core = { path = "../bt-core" }

[dev-dependencies]
bt-a2dp = { path = "../bt-a2dp" }
bt-hci = { path = "../bt-hci" }
bt-l2cap = { path = "../bt-l2cap" }
bt-media-session = { path = "../bt-media-session" }

[[example]]
name = "pcm_to_sbc"
required-features = ["host-libsbc"]

[[example]]
name = "pcm_to_sbc_rtp_acl"
required-features = ["host-libsbc"]

[lints]
workspace = true
