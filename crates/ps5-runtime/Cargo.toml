[package]
name = "ps5-runtime"
description = "C-callable diagnostic bootstrap, with no live PS5 backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = []
capture-stream = ["dep:bt-capture", "bt-capture/external-avcap2"]
continuous-sbc = ["dep:bt-audio", "bt-audio/target-libsbc"]

[dependencies]
bt-capture = { path = "../bt-capture", optional = true }
bt-audio = { path = "../bt-audio", optional = true }
bt-core = { path = "../bt-core" }
bt-hci = { path = "../bt-hci" }
ps5-platform = { path = "../ps5-platform" }

[lints]
workspace = true
